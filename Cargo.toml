[package]
name = "isoextract"
version = "0.2.0"
description = "extract ISO files into extract ISO files in their parent directories by default or elsewhere you designate"
readme = "README.md"
license = "MIT OR Apache-2.0"
edition = "2024"
autoexamples = false
autobenches = false
autotests = false

homepage = "https://crates.io/crates/isoextract"
documentation = "https://docs.rs/isoextract"
repository = "https://github.com/gabrielfalcao/isoextract"

keywords = ["ISO", "extractor", "unix", "system"]
authors = ["Gabriel DeMoura <gabrielteratos@gmail.com>"]
categories = ["command-line-interface"]
# default-run = "hex-to-bin"
# # default-run = "terminal-info"
# # default-run = "contrast"




[lib]
name = "isoextract"
path = "src/lib.rs"

doctest = false
bench = false


[[bin]]
name = "isoextract"
path = "src/main.rs"
doctest = false
bench = false
doc = false
test = false

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "string", "unicode", "wrap_help"] }
iocore = "3.2.0"
isomage = "2.1.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
pretty_assertions = "1.4.1"
